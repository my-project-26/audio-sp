name: Eigene Stimmen erzeugen (Spanisch)

# Gibt den Aufnahmen die Klangfarbe der eigenen Stimmen (OpenVoice, Stimmprofile aus
# my-project-26/sprachen/voices/se). Frauen aus es/, Männer aus es-m/. Ergebnis: es-<stimme>/.
# Läuft täglich weiter, bis alles fertig ist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/voices.yml"]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        voice: [entspannt, rauer, mann1, mann2]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: my-project-26/sprachen
          path: .src
          sparse-checkout: |
            tools
            voices/se
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: OpenVoice installieren
        run: bash .src/tools/openvoice-setup.sh
      - name: Umwandeln
        env:
          OV_SHARD: "${{ matrix.shard }}/4"
          OV_MAX_MIN: "300"
          OV_PUSH_MIN: "25"
        run: |
          git config user.name "wortwerk-bot"
          git config user.email "actions@users.noreply.github.com"
          printf ".src/\nckpt/\n" > .git/info/exclude
          v=${{ matrix.voice }}
          cp .src/voices/se/*.pth . 2>/dev/null || true
          mkdir -p voices/se && mv *.pth voices/se/ 2>/dev/null || true
          printf "voices/\n" >> .git/info/exclude
          [ -f voices/se/$v.pth ] || { echo "Kein Stimmprofil $v"; exit 0; }
          case $v in mann*) SRC=es-m ;; *) SRC=es ;; esac
          [ -d $SRC ] || { echo "Noch keine Aufnahmen in $SRC"; exit 0; }
          python .src/tools/voice-convert.py run $v $SRC es-$v

  index:
    needs: convert
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: my-project-26/sprachen
          path: .src
          sparse-checkout: tools
      - name: Verzeichnisse schreiben
        run: |
          git config user.name "wortwerk-bot"
          git config user.email "actions@users.noreply.github.com"
          echo ".src/" > .git/info/exclude
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main
            python3 .src/tools/write-index.py . es
            git add es-*/index.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Stimmen: Verzeichnisse" && git push -q origin HEAD:main && exit 0
            git reset -q --hard origin/main; sleep 10
          done
